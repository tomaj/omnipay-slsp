name: Bug report
description: Report a defect or unexpected behaviour in omnipay-slsp
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        If this is a security vulnerability, do not continue. Report it privately at https://github.com/tomaj/omnipay-slsp/security/advisories/new (see SECURITY.md).

        Never paste your real `sharedSecret`, account number or customer data.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What went wrong?
      placeholder: completePurchase() throws "Invalid signature" when...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can someone else trigger this?
      placeholder: |
        1. Create a purchase with amount...
        2. Pay in test mode...
        3. Call completePurchase() on the return URL...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include the exception message if there is one.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code sample
      description: The smallest snippet that shows the problem. Remove secrets and personal data.
      render: php
      placeholder: |
        $gateway = Omnipay::create('SporoPay');
        $gateway->setSharedSecret('...');
        $response = $gateway->purchase([...])->send();
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: omnipay-slsp version
      description: The version from composer, for example 3.2.0.
      placeholder: "3.2.0"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      description: Output of `php -v`.
      placeholder: "8.4"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where does it happen?
      options:
        - SporoPay production (ib.slsp.sk)
        - Test mode (payment simulator)
        - Unit tests / no bank involved
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, configuration (with secrets removed), or related issues.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability
          required: true
