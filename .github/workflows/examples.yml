name: Examples

# Runs every example in examples/ against the code of the push or pull request (a Composer path
# repository, see examples/ci/use-local-package.sh) and compares its output with expected-output.txt.
# Everything runs offline: the bank is a fake endpoint on `php -S`, never the real SporoPay.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

# a new push to a pull request cancels its older run
concurrency:
  group: examples-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  example:
    name: Example ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example: [purchase-redirect, return-url, amount-formats, signatures, full-flow]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # main after 2.40.0 (PHP 8.6 stable)
      with:
        php-version: '8.4'
        coverage: none

    - name: Run examples/${{ matrix.example }}
      env:
        EXAMPLE: ${{ matrix.example }}
      run: examples/ci/run.sh "$EXAMPLE"
