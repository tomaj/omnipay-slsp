<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" width="760" height="512" role="img" aria-labelledby="t d">
  <title id="t">SporoPay payment flow</title>
  <desc id="d">The customer pays in the shop, purchase() redirects the browser to SporoPay with the signed fields in the query string, the customer confirms the payment in internet banking, SporoPay redirects the browser back to the return URL with every field signed by SIGN2, and completePurchase() verifies the signature, the variable symbol, the amount and the currency before the shop marks the order paid.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8dbbff"/>
    </marker>
  </defs>
  <rect x="22" y="12" width="210" height="44" rx="10" fill="#1e2330" stroke="#3a4254" stroke-width="1.5"/>
  <text x="127" y="40" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f4f4f5" text-anchor="middle">Customer's browser</text>
  <path d="M127 56V502" stroke="#3a4254" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="275" y="12" width="210" height="44" rx="10" fill="#1e2330" stroke="#3a4254" stroke-width="1.5"/>
  <text x="380" y="40" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f4f4f5" text-anchor="middle">Your shop</text>
  <path d="M380 56V502" stroke="#3a4254" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="528" y="12" width="210" height="44" rx="10" fill="#1e2330" stroke="#3a4254" stroke-width="1.5"/>
  <text x="633" y="40" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f4f4f5" text-anchor="middle">SporoPay</text>
  <path d="M633 56V502" stroke="#3a4254" stroke-width="1.5" stroke-dasharray="4 5"/>
  <path d="M131 134H374" stroke="#8dbbff" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="253" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#f4f4f5" text-anchor="middle">1. Pay 10.00 €</text>
  <text x="253" y="126" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#a1a1aa" text-anchor="middle">the order gets vs 2024000123</text>
  <path d="M376 192H133" stroke="#8dbbff" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="253" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#f4f4f5" text-anchor="middle">2. 302 to SporoPay</text>
  <text x="253" y="184" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#a1a1aa" text-anchor="middle">purchase(): pu_* suma vs … sign1</text>
  <path d="M131 250H627" stroke="#8dbbff" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="380" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#f4f4f5" text-anchor="middle">3. GET epayment.xml?…</text>
  <text x="380" y="242" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#a1a1aa" text-anchor="middle">the signed query string</text>
  <rect x="521" y="268" width="224" height="48" rx="9" fill="#11261a" stroke="#4ade80" stroke-width="1.3"/>
  <text x="633" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#f4f4f5" text-anchor="middle">4. the customer pays</text>
  <text x="633" y="305" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#a1a1aa" text-anchor="middle">internet banking: sign in, confirm</text>
  <path d="M629 366H133" stroke="#8dbbff" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="380" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#f4f4f5" text-anchor="middle">5. 302 to url</text>
  <text x="380" y="358" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#a1a1aa" text-anchor="middle">u_* pu_* suma mena vs ss … result real SIGN2</text>
  <path d="M131 424H374" stroke="#8dbbff" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="253" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#f4f4f5" text-anchor="middle">6. GET /return?…</text>
  <text x="253" y="416" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#a1a1aa" text-anchor="middle">the bank's signed answer</text>
  <rect x="268" y="442" width="224" height="48" rx="9" fill="#11261a" stroke="#4ade80" stroke-width="1.3"/>
  <text x="380" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#f4f4f5" text-anchor="middle">7. completePurchase()</text>
  <text x="380" y="479" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#a1a1aa" text-anchor="middle">SIGN2, vs, suma, then isSuccessful()</text>
</svg>
