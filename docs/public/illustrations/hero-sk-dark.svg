<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440" role="img" aria-labelledby="t d">
  <title id="t">Platba cez SporoPay</title>
  <desc id="d">E-shop presmeruje zákazníka do SporoPay s podpísanou URL, banka ho vráti späť s podpísaným výsledkom a completePurchase() overí podpis, variabilný symbol a sumu skôr, než sa objednávka označí ako zaplatená.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8dbbff"/>
    </marker>
  </defs>

  <!-- the shop -->
  <rect x="16" y="20" width="232" height="176" rx="14" fill="#1e2330" stroke="#3a4254" stroke-width="1.5"/>
  <path d="M16 34a14 14 0 0 1 14-14h204a14 14 0 0 1 14 14v12H16z" fill="#272d3c"/>
  <circle cx="34" cy="34" r="4" fill="#3a4254"/><circle cx="48" cy="34" r="4" fill="#3a4254"/><circle cx="62" cy="34" r="4" fill="#3a4254"/>
  <text x="80" y="38" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#a1a1aa">shop.example/checkout</text>
  <text x="36" y="78" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#a1a1aa">Objednávka 2024000123</text>
  <text x="36" y="112" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#f4f4f5">10,00 €</text>
  <rect x="36" y="134" width="176" height="40" rx="9" fill="#e0242f"/>
  <text x="124" y="159" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Zaplatiť cez SporoPay</text>

  <!-- signed redirect -->
  <path d="M252 72C350 72 392 78 392 112" fill="none" stroke="#8dbbff" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="268" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#f4f4f5">purchase()</text>
  <text x="268" y="96" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#a1a1aa">podpísaná URL</text>

  <!-- internet banking -->
  <rect x="272" y="120" width="232" height="190" rx="14" fill="#1e2330" stroke="#3a4254" stroke-width="1.5"/>
  <path d="M272 134a14 14 0 0 1 14-14h204a14 14 0 0 1 14 14v26H272z" fill="#2870ed"/>
  <text x="290" y="146" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">SporoPay</text>
  <rect x="290" y="170" width="196" height="84" rx="9" fill="#272d3c"/>
  <text x="302" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#a1a1aa">suma</text><text x="474" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f4f4f5" text-anchor="end">10.00 EUR</text>
  <text x="302" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#a1a1aa">vs</text><text x="474" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f4f4f5" text-anchor="end">2024000123</text>
  <text x="302" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#a1a1aa">ss</text><text x="474" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f4f4f5" text-anchor="end">0000000001</text>
  <text x="302" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#a1a1aa">sign1</text>
  <path d="M458 236l4 4 8-9" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="290" y="264" width="196" height="32" rx="8" fill="#f4f4f5"/>
  <text x="388" y="285" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1e2330" text-anchor="middle">Potvrdiť platbu</text>

  <!-- signed return -->
  <path d="M392 314C392 364 352 370 272 370" fill="none" stroke="#8dbbff" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="404" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#f4f4f5">result=OK</text>
  <text x="404" y="364" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#a1a1aa">SIGN2</text>

  <!-- verification -->
  <rect x="16" y="318" width="250" height="104" rx="14" fill="#11261a" stroke="#4ade80" stroke-width="1.5"/>
  <circle cx="56" cy="370" r="22" fill="#4ade80"/>
  <path d="M46 370l4 4 8-9" fill="none" stroke="#11261a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f4f4f5">completePurchase()</text>
  <text x="92" y="378" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#a1a1aa">SIGN2, vs a suma overené</text>
  <text x="92" y="402" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#4ade80">objednávka zaplatená</text>
</svg>
