<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="omnipay-slsp: SporoPay pre Omnipay">
  <rect width="1200" height="630" fill="#f3f7fe"/>
  <rect x="0" y="0" width="1200" height="14" fill="#1f5fd6"/>
  <rect x="0" y="14" width="1200" height="6" fill="#e0242f"/>
  <g transform="translate(80 110) scale(2.6)">
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1f5fd6"/>
  <rect x="11" y="17" width="42" height="30" rx="5" fill="#e0242f"/>
  <rect x="11" y="23" width="42" height="6" fill="#1f5fd6"/>
  <path d="M17 39h11" fill="none" stroke="#1f5fd6" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M37 39.5l4.5 4 8-9" fill="none" stroke="#1f5fd6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="80" y="370" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="84" font-weight="800" fill="#18181b">omnipay-slsp</text>
  <text x="80" y="432" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" fill="#52525b">SporoPay pre Omnipay:</text>
  <text x="80" y="476" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" fill="#52525b">platby podpísané 3DES, overené návraty</text>
  <text x="80" y="566" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#18181b">composer require tomaj/omnipay-slsp</text>
  <g transform="translate(700 70) scale(0.95)">
    

  <!-- the shop -->
  <rect x="16" y="20" width="232" height="176" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <path d="M16 34a14 14 0 0 1 14-14h204a14 14 0 0 1 14 14v12H16z" fill="#f4f4f5"/>
  <circle cx="34" cy="34" r="4" fill="#d4d4d8"/><circle cx="48" cy="34" r="4" fill="#d4d4d8"/><circle cx="62" cy="34" r="4" fill="#d4d4d8"/>
  <text x="80" y="38" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#52525b">shop.example/checkout</text>
  <text x="36" y="78" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#52525b">Objednávka 2024000123</text>
  <text x="36" y="112" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#18181b">10,00 €</text>
  <rect x="36" y="134" width="176" height="40" rx="9" fill="#e0242f"/>
  <text x="124" y="159" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Zaplatiť cez SporoPay</text>

  <!-- signed redirect -->
  <path d="M252 72C350 72 392 78 392 112" fill="none" stroke="#1f5fd6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="268" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#18181b">purchase()</text>
  <text x="268" y="96" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52525b">podpísaná URL</text>

  <!-- internet banking -->
  <rect x="272" y="120" width="232" height="190" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <path d="M272 134a14 14 0 0 1 14-14h204a14 14 0 0 1 14 14v26H272z" fill="#1f5fd6"/>
  <text x="290" y="146" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">SporoPay</text>
  <rect x="290" y="170" width="196" height="84" rx="9" fill="#f1f5fd"/>
  <text x="302" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#52525b">suma</text><text x="474" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#18181b" text-anchor="end">10.00 EUR</text>
  <text x="302" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#52525b">vs</text><text x="474" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#18181b" text-anchor="end">2024000123</text>
  <text x="302" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#52525b">ss</text><text x="474" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#18181b" text-anchor="end">0000000001</text>
  <text x="302" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#52525b">sign1</text>
  <path d="M458 236l4 4 8-9" fill="none" stroke="#15803d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="290" y="264" width="196" height="32" rx="8" fill="#18181b"/>
  <text x="388" y="285" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Potvrdiť platbu</text>

  <!-- signed return -->
  <path d="M392 314C392 364 352 370 272 370" fill="none" stroke="#1f5fd6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="404" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#18181b">result=OK</text>
  <text x="404" y="364" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52525b">SIGN2</text>

  <!-- verification -->
  <rect x="16" y="318" width="250" height="104" rx="14" fill="#ecfdf3" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="56" cy="370" r="22" fill="#15803d"/>
  <path d="M46 370l4 4 8-9" fill="none" stroke="#ecfdf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#18181b">completePurchase()</text>
  <text x="92" y="378" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#52525b">SIGN2, vs a suma overené</text>
  <text x="92" y="402" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#15803d">objednávka zaplatená</text>

  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1f5fd6"/>
    </marker>
  </defs>
</svg>
